name: Supply chain security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Daily check for lockfile drift and known compromised versions
    - cron: '0 12 * * *'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: audit
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.14.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: pnpm

      - name: Install dependencies (frozen lockfile, no lifecycle scripts except allowlist)
        run: pnpm install --frozen-lockfile

      - name: Supply chain check (blocklist + pnpm config)
        run: pnpm run audit:supply-chain

      - name: pnpm audit (high severity and above)
        run: pnpm audit --audit-level=high

      # Runs the osv-scanner image directly, pinned by digest (the osv-scanner action
      # references its image by a mutable tag). Image: ghcr.io/google/osv-scanner:v2.7.0
      - name: OSV vulnerability scan (lockfile)
        run: >-
          docker run --rm -v "$PWD":/src:ro -w /src
          ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          --lockfile=pnpm-lock.yaml

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint
